# Hourly TTL backstop for ephemeral stacks (docs/06-lifecycle-management.md section 6,
# docs/05-automation-pipeline.md section 4.5).
#
# Asks the Platform API which ephemeral stacks are due (GET /v1/internal/ttl/due), then
#   - records the 24 h warning of stacks about to expire (POST /v1/internal/ttl/{id}/warn:
#     audit event ttl.warned, comment on the stack's pull request when the publisher can), and
#   - opens a destroy request for every expired stack (POST /v1/internal/ttl/{id}/teardown),
#     on behalf of the platform, justification "ttl expired". Never for production: the API
#     refuses it under the stack lock, and the due list never contains it.
# The destroy request then follows the normal path (PR, plan -destroy, apply.yml). This
# workflow never runs Terraform and never touches cloud credentials.
#
# The API is reached with the job's GitHub OIDC token only; IACP_INTERNAL_TOKEN is never
# passed here. The backend accepts these routes from this workflow on main, from its
# schedule or a dispatch, and from nothing else (auth.RouteTTL). id-token: write is granted
# to the one job that calls the API; contents: read is the default for the whole file.
#
# While vars.IACP_API_URL is empty the run is skipped with a notice (local-first, ADR-0009).
# A dispatch can pass dry_run to list what would be done without changing anything.
name: ttl-reaper

on:
  schedule:
    - cron: "17 * * * *" # hourly, off the top of the hour when schedules are busiest
  workflow_dispatch:
    inputs:
      dry_run:
        description: List the warnings and teardowns that are due without performing them
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# One pass at a time: a slow run must not overlap the next one. A queued run waits.
concurrency:
  group: iacp-ttl-reaper
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  reap:
    name: warn and tear down expired stacks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      # Schedules only run on the default branch, but a dispatch can pick any ref, and a
      # branch's copy of this file must never reach the API with an OIDC token.
      - name: Require main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error title=ttl-reaper.yml runs only on main::dispatch it from main"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Warn and tear down
        env:
          IACP_API_URL: ${{ vars.IACP_API_URL }}
          IACP_OIDC_AUDIENCE: ${{ vars.IACP_OIDC_AUDIENCE }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--skip-if-unconfigured)
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          python -m tools.ttl_reaper "${args[@]}"

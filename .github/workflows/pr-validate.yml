# Validates every stack root a pull request changes (docs/05-automation-pipeline.md
# section 4.2). Local-first (ADR-0009): plans run against a LocalStack service
# container with the dummy test/test credentials and the Terraform local backend.
# No cloud credentials or OIDC roles are used until ADR-0009 ends.
#
#   detect    -> changed stacks as a JSON matrix (tools/stack_pipeline); fails on
#                any environments/ path outside a valid stack root
#   validate  -> per stack: fmt, module pins, init, installed-module check,
#                validate, TFLint, Checkov (both also as SARIF),
#                plan, show -json, conftest, hermetic LocalStack apply round
#                trip; uploads the plan summary, SARIF and (when Infracost is
#                configured) a redacted plan for the cost job
#   cost      -> per stack: Infracost on the redacted plan; the only job with
#                INFRACOST_API_KEY, and it runs no PR code (informational)
#   cost-summary -> per stack: folds the estimate into the summary (no secrets)
#   budget    -> per stack: the budget gate (policies/opa/budget.rego). Runs the BASE
#                commit's tools and policies, takes the estimate only from the cost job's
#                artifact and the budget from the Platform API, and denies a change that
#                would push the team over a hard budget. Enforces nothing with no budget
#                configured (docs/07 section 6.7)
#   comment   -> sticky PR comment per stack (the only job that can write to the PR)
#   code-scanning -> per stack: uploads the SARIF (the only job with
#                security-events: write); skipped for fork and Dependabot PRs
#   report    -> per stack: POST /v1/runs (pipeline validate) through the iacp-report
#                action; the only job with id-token: write, and it runs no Terraform.
#                Skipped with a notice while vars.IACP_API_URL is empty (ADR-0009)
#   result    -> single required status check, independent of matrix size
#
# The workflow runs on every PR (no paths filter) so pr-validate-result always
# reports; detect returns zero stacks quickly when nothing under environments/
# changed.
name: pr-validate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  PYTHON_VERSION: "3.12"
  TFLINT_VERSION: v0.59.1
  CONFTEST_VERSION: 0.71.1
  CONFTEST_SHA256: c3f6b2a753bd56e377a1e51a95ae3e057f926f2e9139f7d5b5dfbbaf810f7985
  INFRACOST_VERSION: 0.10.49
  # sha256 of infracost-linux-amd64.tar.gz (matches the release's .sha256 file).
  INFRACOST_SHA256: d47ce327416d8d8b9e4c8e42ccbd9b8841e838eb9711fd02319f3bc62a258ee9
  # Dummy credentials for LocalStack only; never real keys.
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: us-east-1
  # Off: every pinned module tag must be published by module-release, and
  # verify-pins refuses an unpublished one. "true" serves unpublished tags from a
  # local mirror of a commit on main (the ADR-0009 bootstrap used before the
  # first releases); keep it off. See docs/05 section 4.2, "Module pins".
  IACP_PIN_BOOTSTRAP: "false"

jobs:
  detect:
    name: detect changed stacks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      count: ${{ steps.detect.outputs.count }}
      terraform_version: ${{ steps.versions.outputs.terraform_version }}
      cost_enabled: ${{ steps.cost.outputs.enabled }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # The cost jobs (WBS 5.5) run only when the Infracost key is configured and the
      # PR comes from this repository. Only whether the secret is set is read here.
      - id: cost
        name: Check the Infracost configuration
        env:
          HAS_KEY: ${{ secrets.INFRACOST_API_KEY != '' }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ "$HAS_KEY" = "true" ] && [ "$SAME_REPO" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Infracost skipped::INFRACOST_API_KEY is not configured for this run (unset, or a fork or Dependabot PR); no cost estimate"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install tool dependencies
        run: python -m pip install --quiet "$(grep -E '^pyyaml==' tools/requirements.txt)"

      - id: versions
        name: Read tool versions
        run: echo "terraform_version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"

      - id: detect
        name: Map changed files to stack roots
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A change to the pipeline, its policies or its tool versions re-validates every stack.
          python -m tools.stack_pipeline detect --base "$BASE_SHA" --head "$HEAD_SHA" \
            --full-run-prefix .github/workflows/pr-validate.yml \
            --full-run-prefix tools/stack_pipeline/ \
            --full-run-prefix policies/ \
            --full-run-prefix .tflint.hcl \
            --full-run-prefix .terraform-version | tee "$RUNNER_TEMP/detect.json"
          {
            echo "### Changed stacks"
            jq -r 'if .count == 0 then "No stack roots changed." else (.stacks[] | "- `\(.path)`") end' "$RUNNER_TEMP/detect.json"
            jq -r 'if .full_run then "\nThe pipeline changed, so every stack is validated." else empty end' "$RUNNER_TEMP/detect.json"
          } >> "$GITHUB_STEP_SUMMARY"

  validate:
    name: validate (${{ matrix.stack.path }})
    needs: detect
    if: needs.detect.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        stack: ${{ fromJSON(needs.detect.outputs.matrix) }}
    # One plan per stack per PR: a new push cancels the stale plan of the same stack.
    # apply.yml uses the non-cancelling group iacp-stack-<id>-apply.
    concurrency:
      group: iacp-stack-${{ matrix.stack.id }}-plan-pr${{ github.event.pull_request.number }}
      cancel-in-progress: true
    services:
      localstack:
        image: localstack/localstack:4.4@sha256:b52c16663c70b7234f217cb993a339b46686e30a1a5d9279cb5feeb2202f837c
        ports:
          - 4566:4566
        env:
          SERVICES: s3,sqs,sns,lambda,iam,sts,kms,logs,cloudwatch,secretsmanager,events,ec2,dynamodb,dynamodbstreams,kinesis
          AWS_DEFAULT_REGION: us-east-1
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      STACK_ID: ${{ matrix.stack.id }}
      STACK_PATH: ${{ matrix.stack.path }}
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache
      TFLINT_PLUGIN_DIR: ${{ github.workspace }}/.tflint.d/plugins
      # Steps run inside the stack root; keep `python -m tools.stack_pipeline` importable.
      PYTHONPATH: ${{ github.workspace }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.stack.path }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history: module pins are checked against origin/main.
          fetch-depth: 0
          persist-credentials: false

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ needs.detect.outputs.terraform_version }}
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
          github_token: ${{ github.token }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: policies/checkov/requirements.txt

      - name: Install Checkov and tool dependencies
        working-directory: .
        run: |
          python -m pip install --quiet -r policies/checkov/requirements.txt
          python -m pip install --quiet "$(grep -E '^pyyaml==' tools/requirements.txt)"

      - name: Install conftest (checksum verified)
        working-directory: .
        run: |
          tarball="conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/${tarball}"
          echo "${CONFTEST_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/bin" conftest
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Provider and TFLint plugin caches (WBS 5.4). Provider downloads are still
      # verified against the committed .terraform.lock.hcl on init.
      - name: Cache Terraform providers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-providers-${{ runner.os }}-${{ hashFiles(format('{0}/.terraform.lock.hcl', matrix.stack.path)) }}
          restore-keys: tf-providers-${{ runner.os }}-

      - name: Cache TFLint plugins
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.TFLINT_PLUGIN_DIR }}
          key: tflint-${{ runner.os }}-${{ env.TFLINT_VERSION }}-${{ hashFiles('.tflint.hcl') }}

      - id: fmt
        name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - id: pins
        name: Verify module pins
        # Published tags must resolve to the commit in iacp.stack.json. Unpublished tags
        # are refused unless IACP_PIN_BOOTSTRAP is "true" (ADR-0009); then they are served
        # from a local mirror of a commit already on main. The source string, and so the
        # policy input, is unchanged.
        run: |
          args=(--mirror "$RUNNER_TEMP/module-mirror.git")
          if [ "${IACP_PIN_BOOTSTRAP:-false}" = "true" ]; then args+=(--allow-unpublished); fi
          python -m tools.stack_pipeline --repo-root "$GITHUB_WORKSPACE" verify-pins . "${args[@]}"

      - id: init
        name: terraform init (local backend)
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform init -input=false -lockfile=readonly -no-color

      - id: modules
        name: Verify installed modules
        # One-to-one match between the module calls init installed and the pins,
        # exact pinned sources, and each fetched checkout at its recorded commit.
        run: python -m tools.stack_pipeline --repo-root "$GITHUB_WORKSPACE" verify-modules .

      - id: validate
        name: terraform validate
        run: terraform validate -no-color

      - id: tflint
        name: TFLint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$TFLINT_PLUGIN_DIR"
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

      # SARIF for code scanning (WBS 6.1): a second, non-gating run; the step above
      # keeps deciding pass or fail.
      - name: TFLint SARIF (code scanning)
        if: always() && steps.tflint.outcome != 'skipped'
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/sarif"
          tflint --config "$GITHUB_WORKSPACE/.tflint.hcl" --format sarif > "$RUNNER_TEMP/sarif/tflint.raw.sarif" || true

      - id: checkov
        name: Checkov (stack and downloaded modules)
        # CKV_TF_1 wants a commit hash in the source string. Stacks pin exact release
        # tags (enforced by OPA iacp.forbidden.module_source), and the tag-to-commit
        # binding is verified twice above: "Verify module pins" against the remote and
        # "Verify installed modules" against what init actually fetched.
        # The SARIF file is an extra output; the exit code (the gate) is unchanged.
        run: |
          mkdir -p "$RUNNER_TEMP/sarif"
          checkov --directory . --framework terraform \
            --download-external-modules true \
            --external-modules-download-path "$RUNNER_TEMP/checkov-modules" \
            --external-checks-dir "$GITHUB_WORKSPACE/policies/checkov" \
            --skip-check CKV_TF_1 \
            --quiet --compact \
            --output cli --output sarif --output-file-path "console,$RUNNER_TEMP/sarif/checkov.raw.sarif"

      # Both tools name files relative to the stack root, and Checkov names the
      # downloaded modules by temp path; code scanning needs repository paths.
      # Fork PRs cannot upload (read-only token), so their SARIF is not kept.
      - name: Prepare SARIF for code scanning
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/sarif-upload"
          for tool in tflint checkov; do
            raw="$RUNNER_TEMP/sarif/$tool.raw.sarif"
            if [ ! -s "$raw" ]; then echo "no $tool SARIF (the scan did not run)"; continue; fi
            # Invalid SARIF is refused by `sarif`, so no file is written for that tool
            # and the other tool is still prepared.
            python -m tools.stack_pipeline --repo-root "$GITHUB_WORKSPACE" sarif . --in "$raw" \
              --out "$RUNNER_TEMP/sarif-upload/$tool.sarif" --external-dir "$RUNNER_TEMP/checkov-modules" \
              || { rm -f "$RUNNER_TEMP/sarif-upload/$tool.sarif"; echo "::warning title=Invalid SARIF::$tool SARIF is not uploaded"; }
          done

      # Non-gating extra: a failed upload never fails the required check. overwrite
      # lets a re-run of this leg replace the artifact instead of failing with 409.
      - name: Keep SARIF for the code scanning upload
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sarif-${{ matrix.stack.id }}
          path: ${{ runner.temp }}/sarif-upload/*.sarif
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

      - id: plan
        name: terraform plan
        run: |
          terraform plan -input=false -lock=false -no-color -out=tfplan 2>&1 | tee "$RUNNER_TEMP/plan.txt"

      - id: show
        name: terraform show -json
        run: terraform show -json tfplan > "$RUNNER_TEMP/plan.json"

      # Plan for the separate cost job (WBS 5.5), only when that job will run.
      # cost-input nulls every value Terraform marks sensitive and drops prior state,
      # variables and outputs; the full tfplan and plan.json still never leave the job.
      - name: Prepare the plan for Infracost
        if: steps.show.outcome == 'success' && needs.detect.outputs.cost_enabled == 'true'
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/cost-input"
          python -m tools.stack_pipeline cost-input --plan "$RUNNER_TEMP/plan.json" --out "$RUNNER_TEMP/cost-input/plan.json"

      - name: Keep the plan for Infracost
        if: steps.show.outcome == 'success' && needs.detect.outputs.cost_enabled == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cost-input-${{ matrix.stack.id }}
          path: ${{ runner.temp }}/cost-input/plan.json
          if-no-files-found: ignore
          retention-days: 1
          overwrite: true

      - id: conftest
        name: OPA policies (conftest)
        # The context comes from iacp.stack.json until GET /v1/internal/budget-context
        # (WBS 6.4) exists. Warnings are reported in the PR comment, not blocking.
        run: |
          python -m tools.stack_pipeline --repo-root "$GITHUB_WORKSPACE" context . > "$RUNNER_TEMP/policy-context.json"
          status=0
          conftest test "$RUNNER_TEMP/plan.json" \
            --policy "$GITHUB_WORKSPACE/policies/opa" \
            --data "$RUNNER_TEMP/policy-context.json" \
            --output json > "$RUNNER_TEMP/conftest.json" || status=$?
          jq -r '.[] | (.failures[]? | "deny: \(.msg)"), (.warnings[]? | "warn: \(.msg)")' "$RUNNER_TEMP/conftest.json" || true
          exit "$status"

      - id: roundtrip
        name: Apply round trip on LocalStack (ADR-0009)
        # Hermetic check while local-first: apply the reviewed plan to this job's
        # throwaway LocalStack container, require an empty re-plan (exit code 2
        # means the stack is not idempotent), then destroy. No state or resources
        # outside the job are touched; real accounts change only through apply.yml.
        run: |
          terraform apply -input=false -lock=false -no-color tfplan
          terraform plan -input=false -lock=false -no-color -detailed-exitcode
          terraform destroy -input=false -lock=false -no-color -auto-approve

      - name: Build plan summary
        if: always()
        env:
          OUT_FMT: ${{ steps.fmt.outcome }}
          OUT_PINS: ${{ steps.pins.outcome }}
          OUT_INIT: ${{ steps.init.outcome }}
          OUT_MODULES: ${{ steps.modules.outcome }}
          OUT_VALIDATE: ${{ steps.validate.outcome }}
          OUT_TFLINT: ${{ steps.tflint.outcome }}
          OUT_CHECKOV: ${{ steps.checkov.outcome }}
          OUT_PLAN: ${{ steps.plan.outcome }}
          OUT_SHOW: ${{ steps.show.outcome }}
          OUT_ROUNDTRIP: ${{ steps.roundtrip.outcome }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          out="$RUNNER_TEMP/summary"
          mkdir -p "$out"
          python -m tools.stack_pipeline --repo-root "$GITHUB_WORKSPACE" summary . \
            --plan "$RUNNER_TEMP/plan.json" \
            --conftest "$RUNNER_TEMP/conftest.json" \
            --plan-text "$RUNNER_TEMP/plan.txt" \
            --step "fmt=$OUT_FMT" --step "module pins=$OUT_PINS" --step "init=$OUT_INIT" \
            --step "installed modules=$OUT_MODULES" \
            --step "validate=$OUT_VALIDATE" --step "tflint=$OUT_TFLINT" --step "checkov=$OUT_CHECKOV" \
            --step "plan=$OUT_PLAN" --step "show -json=$OUT_SHOW" --step "LocalStack apply round trip=$OUT_ROUNDTRIP" \
            --commit "$HEAD_SHA" --run-url "$RUN_URL" \
            --markdown-out "$out/comment.md" --json-out "$out/summary.json"
          cat "$out/comment.md" >> "$GITHUB_STEP_SUMMARY"

      # Only the rendered summary leaves the job (and, for the cost job, the redacted
      # plan above): tfplan and plan.json can hold sensitive values and are never
      # uploaded or committed. Kept fatal: the comment and report jobs read it, and a
      # missing summary is reported as failed. overwrite makes a re-run of this leg
      # replace the artifact instead of failing with 409.
      - name: Upload plan summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-validate-${{ matrix.stack.id }}
          path: |
            ${{ runner.temp }}/summary/comment.md
            ${{ runner.temp }}/summary/summary.json
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  # Prices each stack's plan with Infracost (WBS 5.5, informational). The only job
  # that receives INFRACOST_API_KEY. It checks out nothing and runs only the pinned,
  # checksum-verified Infracost binary on the redacted plan from validate, so no
  # PR-controlled code runs in it. Skipped unless the secret is set and the PR comes
  # from this repository; never fails the workflow. Infracost sends resource
  # attributes (types, regions, sizes) to its pricing API, not the plan file.
  cost:
    name: cost (${{ matrix.stack.path }})
    needs: [detect, validate]
    if: >-
      always() && needs.detect.result == 'success' && needs.detect.outputs.count != '0'
      && needs.detect.outputs.cost_enabled == 'true'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.detect.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Download the redacted plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cost-input-${{ matrix.stack.id }}
          path: ${{ runner.temp }}/cost-input

      - name: Infracost breakdown
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
          INFRACOST_SKIP_UPDATE_CHECK: "true"
          INFRACOST_ENABLE_CLOUD: "false"
          INFRACOST_NO_COLOR: "true"
        run: |
          tarball=infracost-linux-amd64.tar.gz
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/infracost/infracost/releases/download/v${INFRACOST_VERSION}/${tarball}"
          echo "${INFRACOST_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/infracost" "$RUNNER_TEMP/cost"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/infracost" infracost-linux-amd64
          "$RUNNER_TEMP/infracost/infracost-linux-amd64" breakdown --path "$RUNNER_TEMP/cost-input/plan.json" \
            --format json --out-file "$RUNNER_TEMP/cost/infracost.json"
          "$RUNNER_TEMP/infracost/infracost-linux-amd64" output --path "$RUNNER_TEMP/cost/infracost.json" --format table

      - name: Keep the estimate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cost-${{ matrix.stack.id }}
          path: ${{ runner.temp }}/cost/infracost.json
          retention-days: 7
          overwrite: true

  # Folds the estimate into the stack's summary.json and comment.md with
  # tools/stack_pipeline fold-cost and re-uploads them for the comment and report
  # jobs. It runs the PR's tools/ code, so it gets no secret and no write token.
  # Never fails the workflow; without an estimate the summary is left as it is.
  cost-summary:
    name: cost summary (${{ matrix.stack.path }})
    needs: [detect, validate, cost]
    if: >-
      always() && needs.detect.result == 'success' && needs.detect.outputs.count != '0'
      && needs.detect.outputs.cost_enabled == 'true'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.detect.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install tool dependencies
        run: python -m pip install --quiet "$(grep -E '^pyyaml==' tools/requirements.txt)"

      - name: Download the summary
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pr-validate-${{ matrix.stack.id }}
          path: ${{ runner.temp }}/summary

      - name: Download the estimate
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cost-${{ matrix.stack.id }}
          path: ${{ runner.temp }}/cost

      - id: fold
        name: Fold the cost into the summary
        run: |
          if [ ! -f "$RUNNER_TEMP/summary/summary.json" ] || [ ! -f "$RUNNER_TEMP/cost/infracost.json" ]; then
            echo "::notice title=No cost estimate::nothing to fold (the summary or the estimate is missing)"
            echo "folded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python -m tools.stack_pipeline fold-cost \
            --summary-json "$RUNNER_TEMP/summary/summary.json" \
            --markdown "$RUNNER_TEMP/summary/comment.md" \
            --cost "$RUNNER_TEMP/cost/infracost.json" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "folded=true" >> "$GITHUB_OUTPUT"

      - name: Replace the summary
        if: steps.fold.outputs.folded == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-validate-${{ matrix.stack.id }}
          path: |
            ${{ runner.temp }}/summary/comment.md
            ${{ runner.temp }}/summary/summary.json
          retention-days: 7
          overwrite: true

  # Budget gate (WBS 8.5, policies/opa/budget.rego): denies a stack whose estimated monthly
  # cost would push the team's month over a hard budget. It is the only place the estimate
  # meets the policy, and it is built so a pull request cannot move that number:
  #
  # - It checks out the BASE commit (the target branch), so the policy, `tools/` and the
  #   context builder it runs are main's, whatever this PR changes in them. (The workflow
  #   file itself is the PR's; .github/, policies/ and tools/ are platform-owned in
  #   CODEOWNERS, the same boundary every gate in this workflow relies on.)
  # - The estimate is read only from the `cost-<id>` artifact: the output of the pinned
  #   Infracost binary in the isolated `cost` job, the only job holding INFRACOST_API_KEY.
  #   This job never sees that key, and nothing from the PR's tree (iacp.stack.json,
  #   summary.json, the stack directory) is read: identity is the detected stack path.
  # - The budget and any override come from the Platform API (OIDC), never from the PR.
  # - A missing estimate is not a pass: with a budget set it is denied in staging and
  #   production (a warning in development), see budget.rego.
  #
  # With no budget configured (the local-first default, ADR-0009: vars.IACP_API_URL is
  # empty) nothing is enforced and the job only reports. The PR's plan is evaluated as
  # input so a destroy-only change always passes. id-token: write is safe here because
  # only the base commit's code runs; contents is the only other permission.
  budget:
    name: budget (${{ matrix.stack.path }})
    needs: [detect, validate, cost]
    if: always() && needs.detect.result == 'success' && needs.detect.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.detect.outputs.matrix) }}
    env:
      STACK_PATH: ${{ matrix.stack.path }}
      IACP_API_URL: ${{ vars.IACP_API_URL }}
      IACP_OIDC_AUDIENCE: ${{ vars.IACP_OIDC_AUDIENCE }}
      PYTHONPATH: ${{ github.workspace }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install tool dependencies
        run: python -m pip install --quiet "$(grep -E '^pyyaml==' tools/requirements.txt)"

      - name: Install conftest (checksum verified)
        run: |
          tarball="conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/${tarball}"
          echo "${CONFTEST_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/bin" conftest
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # The target branch must already have the gate (this guard only matters for the
      # change that introduces it). A PR cannot trigger it: the files are main's.
      - id: ready
        name: Check the target branch has the budget gate
        run: |
          help_text="$(python -m tools.stack_pipeline context --help)"
          if grep -q -- '--budget-gate' <<<"$help_text" && [ -f policies/opa/budget.rego ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Budget gate not on the target branch::the base commit has no budget gate yet; nothing is enforced for this run"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the estimate (isolated cost job)
        if: steps.ready.outputs.ready == 'true'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cost-${{ matrix.stack.id }}
          path: ${{ runner.temp }}/cost

      - name: Download the plan the estimate was computed from
        if: steps.ready.outputs.ready == 'true'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cost-input-${{ matrix.stack.id }}
          path: ${{ runner.temp }}/cost-input

      # Skipped with a notice while vars.IACP_API_URL is empty (no budget then). When the
      # API is configured a failure here fails the job: a budget that cannot be read is not
      # a budget that is absent.
      - name: Fetch the team budget
        if: steps.ready.outputs.ready == 'true'
        run: |
          python -m tools.stack_pipeline fetch-budget-context --stack-path "$STACK_PATH" \
            --out "$RUNNER_TEMP/api-context.json" --skip-if-unconfigured

      - id: gate
        name: Budget policy (conftest)
        if: steps.ready.outputs.ready == 'true'
        run: |
          plan="$RUNNER_TEMP/cost-input/plan.json"
          if [ ! -f "$plan" ]; then echo '{}' > "$RUNNER_TEMP/no-plan.json"; plan="$RUNNER_TEMP/no-plan.json"; fi
          python -m tools.stack_pipeline context --budget-gate --stack-path "$STACK_PATH" \
            --cost "$RUNNER_TEMP/cost/infracost.json" \
            --api-context "$RUNNER_TEMP/api-context.json" > "$RUNNER_TEMP/budget-context.json"
          if [ "$(jq '.iacp.context.budget != null' "$RUNNER_TEMP/budget-context.json")" != "true" ]; then
            echo "::notice title=No budget configured::no team budget applies to $STACK_PATH, so the cost estimate is informational"
          fi
          status=0
          conftest test "$plan" \
            --policy "$GITHUB_WORKSPACE/policies/opa" \
            --namespace iacp.budget \
            --data "$RUNNER_TEMP/budget-context.json" \
            --output json > "$RUNNER_TEMP/budget.json" || status=$?
          {
            echo "### Budget: \`$STACK_PATH\`"
            jq -r '.[] | (.failures[]? | "- **deny** \(.msg)"), (.warnings[]? | "- warn \(.msg)")' "$RUNNER_TEMP/budget.json"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          jq -r '.[] | (.failures[]? | "deny: \(.msg)"), (.warnings[]? | "warn: \(.msg)")' "$RUNNER_TEMP/budget.json" || true
          exit "$status"

  comment:
    name: sticky PR comments
    needs: [detect, validate, cost-summary]
    # Fork PRs get a read-only token; their summaries stay in the job summary.
    if: >-
      always() && needs.detect.result == 'success' && needs.detect.outputs.count != '0'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: pr-validate-*
          path: summaries

      # Create or update one comment per stack, found by its hidden marker. The
      # marker is built here from the artifact name; any marker-looking line in the
      # artifact body is dropped, so a body can never claim another stack's comment.
      - name: Upsert comments
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          for dir in summaries/pr-validate-*/; do
            id="$(basename "$dir")"
            id="${id#pr-validate-}"
            if [[ ! "$id" =~ ^[a-z0-9_-]+$ ]] || [ ! -f "${dir}comment.md" ]; then
              echo "::warning::skipping malformed summary $dir"
              continue
            fi
            marker="<!-- iacp-plan:${id} -->"
            body="$RUNNER_TEMP/comment-${id}.md"
            { echo "$marker"; grep -v -F '<!-- iacp-plan:' "${dir}comment.md" || true; } > "$body"
            existing="$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
              --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n1)"
            if [ -n "$existing" ]; then
              gh api --method PATCH "repos/$REPO/issues/comments/$existing" -F "body=@$body" --silent
              echo "updated comment $existing for $id"
            else
              gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" -F "body=@$body" --silent
              echo "created comment for $id"
            fi
          done

  # Uploads each stack's TFLint and Checkov SARIF to code scanning (WBS 6.1), one
  # category per tool and stack. The only job with security-events: write; it runs
  # no PR code, only checkout and the pinned upload action. Fork and Dependabot PRs
  # get a read-only token and are skipped. Not part of pr-validate-result.
  code-scanning:
    name: code scanning (${{ matrix.stack.path }})
    needs: [detect, validate]
    if: >-
      always() && needs.detect.result == 'success' && needs.detect.outputs.count != '0'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Missing when the leg failed before the scans ran.
      - name: Download SARIF
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sarif-${{ matrix.stack.id }}
          path: ${{ runner.temp }}/sarif

      - id: files
        name: Find SARIF files
        run: |
          for tool in tflint checkov; do
            if [ -s "$RUNNER_TEMP/sarif/$tool.sarif" ]; then echo "$tool=true"; else echo "$tool=false"; fi
          done | tee -a "$GITHUB_OUTPUT"

      - name: Upload TFLint SARIF
        if: steps.files.outputs.tflint == 'true'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/sarif/tflint.sarif
          category: pr-validate/tflint/${{ matrix.stack.id }}

      - name: Upload Checkov SARIF
        if: steps.files.outputs.checkov == 'true'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/sarif/checkov.sarif
          category: pr-validate/checkov/${{ matrix.stack.id }}

  # Reports each stack's summary to the Platform API. A separate job so the OIDC
  # permission is never present while PR-controlled Terraform and providers run.
  # A report failure is a warning and never fails the PR (docs/05 stage 9).
  report:
    name: report (${{ matrix.stack.path }})
    needs: [detect, validate, cost-summary]
    # Fork PRs get neither id-token nor secrets; their result stays in the job summary.
    if: >-
      always() && needs.detect.result == 'success' && needs.detect.outputs.count != '0'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.detect.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install tool dependencies
        run: python -m pip install --quiet "$(grep -E '^pyyaml==' tools/requirements.txt)"

      # A missing summary (the leg failed before writing it) is reported as failed.
      - name: Download plan summary
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pr-validate-${{ matrix.stack.id }}
          path: ${{ runner.temp }}/summary

      # head_sha is github.sha (the merge commit the OIDC token names), never the PR
      # head; request_short_id and fencing_token come from iacp.stack.json.
      # OIDC only: this job runs the PR's own tools/ and action code, so it must
      # never see IACP_INTERNAL_TOKEN, which the API does not scope to a workflow.
      # Without IACP_OIDC_AUDIENCE the report fails (as a warning) instead.
      - name: Report to the Platform API
        uses: ./.github/actions/iacp-report
        with:
          api-url: ${{ vars.IACP_API_URL }}
          audience: ${{ vars.IACP_OIDC_AUDIENCE }}
          pipeline: validate
          stack-path: ${{ matrix.stack.path }}
          stage: summary
          summary-json: ${{ runner.temp }}/summary/summary.json

  result:
    name: pr-validate-result
    needs: [detect, validate, budget]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require detect to succeed and validate and budget to succeed or skip
        env:
          DETECT: ${{ needs.detect.result }}
          VALIDATE: ${{ needs.validate.result }}
          BUDGET: ${{ needs.budget.result }}
        run: |
          echo "detect=$DETECT validate=$VALIDATE budget=$BUDGET"
          [ "$DETECT" = "success" ] || exit 1
          [ "$VALIDATE" = "success" ] || [ "$VALIDATE" = "skipped" ] || exit 1
          [ "$BUDGET" = "success" ] || [ "$BUDGET" = "skipped" ] || exit 1

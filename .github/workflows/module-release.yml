# Module release (WBS 3.6, 3.7). See docs/04-module-registry.md section 9 and
# docs/05-automation-pipeline.md section 4.6.
#
# pull_request: check-only, on every PR so the required "semver gate result"
#   check always reports. When the PR touches modules/ or this tooling, runs the
#   SemVer interface-diff gate for every module it touches and for every module
#   whose version is not tagged yet (merging will release it). Otherwise the
#   matrix is empty and the check passes. Nothing is tagged.
# push to main: runs the gate for changed modules, modules whose declared
#   version has no tag yet and modules tagged without a GitHub release, then
#   creates modules/<name>/v<version>, a GitHub release, and (when configured)
#   indexes the version in the catalog.
# workflow_dispatch on main: the same as a push, over every module. Use it to
#   re-run a release or a catalog index that failed. Releases run only from
#   main via push or workflow_dispatch, which is also the only OIDC caller
#   the backend accepts on /v1/internal/catalog/index (auth.RouteCatalogIndex).
#
# fmt, validate, TFLint, Checkov, terraform test, the manifest validator and
# Terratest already run on every PR in ci.yml; this workflow does not repeat them.
name: module-release

on:
  # No paths filter: a required check must report on every PR (see detect).
  pull_request:
  push:
    branches: [main]
    paths:
      - "modules/**"
      - "tools/module_release/**"
      - "tools/requirements.txt"
      - ".github/workflows/module-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never cancel a release in progress; PR runs may be superseded.
  group: module-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  # Paths that can change what the gate decides; detect skips the tool otherwise.
  RELEASE_PATHS: modules tools/module_release tools/requirements.txt .github/workflows/module-release.yml

defaults:
  run:
    shell: bash # bash --noprofile --norc -eo pipefail {0}: a failing command in a pipeline fails the step

jobs:
  detect:
    name: detect changed modules
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      modules: ${{ steps.detect.outputs.modules }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # tags and history for the diff base
          persist-credentials: false

      - id: scope
        name: Check whether the gate is needed
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base="$(git merge-base "$PR_BASE" HEAD)"
            # RELEASE_PATHS is a space-separated list of pathspecs.
            # shellcheck disable=SC2086
            changed="$(git diff --name-only "$base" HEAD -- $RELEASE_PATHS)"
            needed=$([ -n "$changed" ] && echo true || echo false)
          else
            # push is path-filtered; workflow_dispatch has no base, so detect selects every module.
            base="$PUSH_BEFORE"
            needed=true
          fi
          { echo "base=$base"; echo "needed=$needed"; } | tee -a "$GITHUB_OUTPUT"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.scope.outputs.needed == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install tool dependencies
        if: steps.scope.outputs.needed == 'true'
        run: python -m pip install --quiet -r tools/requirements.txt

      - id: detect
        name: Detect modules
        env:
          EVENT: ${{ github.event_name }}
          NEEDED: ${{ steps.scope.outputs.needed }}
          BASE: ${{ steps.scope.outputs.base }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$NEEDED" != "true" ]; then
            echo "modules=[]" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          # --include-untagged: a module whose declared version has no tag is
          # released on the next push to main, so a failed or skipped run self-heals.
          args=(detect --base "$BASE" --include-untagged)
          if [ "$EVENT" != "pull_request" ]; then
            # Also retry modules whose tag exists but whose GitHub release is missing.
            gh release list --repo "$REPO" --limit 1000 --json tagName --jq '.[].tagName' > "$RUNNER_TEMP/released.txt"
            args+=(--released-tags "$RUNNER_TEMP/released.txt")
          fi
          modules="$(python -m tools.module_release "${args[@]}")"
          echo "modules=$modules" | tee -a "$GITHUB_OUTPUT"

  gate:
    needs: detect
    if: needs.detect.outputs.modules != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.detect.outputs.modules) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the gate reads the module at its last release tag
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install tool dependencies
        run: python -m pip install --quiet -r tools/requirements.txt

      - name: SemVer interface-diff gate
        env:
          MODULE: ${{ matrix.module }}
        run: |
          status=0
          python -m tools.module_release gate "$MODULE" > "$RUNNER_TEMP/gate.txt" || status=$?
          cat "$RUNNER_TEMP/gate.txt"
          {
            echo "### SemVer gate: \`$MODULE\`"
            echo '```'
            cat "$RUNNER_TEMP/gate.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # Single status check for branch protection; green when the gate passed or was not needed.
  gate-result:
    name: semver gate result
    needs: [detect, gate]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check gate results
        env:
          DETECT: ${{ needs.detect.result }}
          GATE: ${{ needs.gate.result }}
        run: |
          echo "detect=$DETECT gate=$GATE"
          [ "$DETECT" = "success" ] || exit 1
          [ "$GATE" = "success" ] || [ "$GATE" = "skipped" ] || exit 1

  release:
    needs: [detect, gate]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main' && needs.detect.outputs.modules != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the tag and the GitHub release
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.detect.outputs.modules) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install tool dependencies
        run: python -m pip install --quiet -r tools/requirements.txt

      - id: info
        name: Read version
        env:
          MODULE: ${{ matrix.module }}
        run: python -m tools.module_release info "$MODULE" | tee -a "$GITHUB_OUTPUT"

      - name: Create tag
        if: steps.info.outputs.tag_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.info.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          # A ref that already exists is never moved: the API returns 422.
          gh api "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
          echo "::notice title=Tagged::$TAG -> $GITHUB_SHA"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          MODULE: ${{ matrix.module }}
          TAG: ${{ steps.info.outputs.tag }}
          VERSION: ${{ steps.info.outputs.version }}
          PRERELEASE: ${{ steps.info.outputs.prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice title=Release exists::$TAG already has a release"
            exit 0
          fi
          python -m tools.module_release notes "$MODULE" > "$RUNNER_TEMP/notes.md"
          flags=(--verify-tag --title "$MODULE v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" --latest=false)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}"

      - name: Index into catalog
        env:
          GH_TOKEN: ${{ github.token }}
          MODULE: ${{ matrix.module }}
          TAG: ${{ steps.info.outputs.tag }}
          REPO: ${{ github.repository }}
          IACP_API_URL: ${{ vars.IACP_API_URL }}
          IACP_INTERNAL_TOKEN: ${{ secrets.IACP_INTERNAL_TOKEN }}
        run: |
          # Index the commit the tag points at (it may predate this push on a re-run).
          # Peel an annotated tag (object.type == "tag") to its commit.
          type="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq .object.type)"
          sha="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq .object.sha)"
          if [ "$type" = "tag" ]; then
            sha="$(gh api "repos/$REPO/git/tags/$sha" --jq .object.sha)"
          fi
          python -m tools.module_release index "$MODULE" --commit-sha "$sha" --skip-if-unconfigured

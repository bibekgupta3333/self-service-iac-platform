apiVersion: iacp.dev/v1
kind: Module
metadata:
  name: lambda
  version: 2.0.0
  displayName: Lambda Function
  description: Lambda function with a least-privilege role, KMS-encrypted logs and environment, X-Ray tracing and an optional SQS trigger.
  category: compute
  maturity: beta
  owners:
    - "@bibekgupta3333/platform"
  documentation: https://github.com/bibekgupta3333/self-service-iac-platform/tree/modules/lambda/v2.0.0/modules/lambda

compatibility:
  terraform: ">= 1.10, < 2.0"
  providers:
    hashicorp/aws: ">= 5.70, < 6.0"
  environments: [development, staging, production]

inputs:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  required: [name, runtime, artifact_s3_uri]
  additionalProperties: false
  properties:
    name:
      type: string
      pattern: "^[a-z][a-z0-9-]{2,40}$"
      description: Logical function name. Final name is <team>-<environment>-<name>.
      x-iacp-immutable: true
    runtime:
      type: string
      enum: [python3.12, python3.13, nodejs20.x, nodejs22.x, java21, provided.al2023]
      description: Lambda runtime.
      x-iacp-ui: select
    handler:
      type: string
      pattern: "^[A-Za-z0-9_.:/$-]{1,128}$"
      default: bootstrap
      description: Function entry point, for example app.handler.
    architecture:
      type: string
      enum: [arm64, x86_64]
      default: arm64
      description: Instruction set architecture.
      x-iacp-ui: select
    artifact_s3_uri:
      type: string
      pattern: "^s3://[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]/.+\\.zip$"
      description: s3:// URI of the deployment package built by the application's CI.
      x-iacp-group: Code
    source_code_hash:
      type: [string, "null"]
      default: null
      description: Base64 SHA-256 of the package. Changing it redeploys the code.
      x-iacp-group: Code
    memory_mb:
      type: integer
      minimum: 128
      maximum: 10240
      default: 256
      description: Memory in MB.
    timeout_seconds:
      type: integer
      minimum: 1
      maximum: 900
      default: 30
      description: Maximum execution time in seconds.
    reserved_concurrent_executions:
      type: [integer, "null"]
      minimum: 1
      maximum: 1000
      default: 10
      description: Reserved concurrency (1-1000). Null leaves the function unreserved, which is not allowed in production.
    tracing_mode:
      type: string
      enum: [Active, PassThrough]
      default: Active
      description: X-Ray tracing mode. Only Active is allowed in production.
      x-iacp-group: Observability
    environment_variables:
      type: object
      additionalProperties: { type: string }
      propertyNames:
        pattern: "^[A-Za-z][A-Za-z0-9_]*$"
        not: { pattern: "^AWS_" }
      default: {}
      description: Non-secret configuration. Use Secrets Manager ARNs for secrets. Keys may not start with AWS_.
      x-iacp-ui: key-value
    log_retention_days:
      type: integer
      enum: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]
      default: 30
      description: CloudWatch Logs retention in days.
      x-iacp-group: Observability
    kms_key_arn:
      type: [string, "null"]
      default: null
      pattern: "^arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/.+$"
      description: Existing KMS key ARN for environment variables and logs. If null, a dedicated key is created.
      x-iacp-group: Encryption
    sqs_trigger:
      type: [object, "null"]
      default: null
      description: Optional SQS trigger. batch_size is 1-10 unless maximum_batching_window_in_seconds is greater than 0 (FIFO queues stay at 10).
      additionalProperties: false
      required: [queue_arn]
      properties:
        queue_arn:
          type: string
          pattern: "^arn:aws[a-z-]*:sqs:[a-z0-9-]+:[0-9]{12}:.+$"
          x-iacp-ui: stack-output
        kms_key_arn:
          type: [string, "null"]
          pattern: "^arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/.+$"
          x-iacp-ui: stack-output
        batch_size:
          type: integer
          minimum: 1
          maximum: 10000
          default: 10
        maximum_batching_window_in_seconds:
          type: integer
          minimum: 0
          maximum: 300
          default: 0
      allOf:
        - if:
            anyOf:
              - not: { required: [maximum_batching_window_in_seconds] }
              - properties: { maximum_batching_window_in_seconds: { const: 0 } }
          then:
            properties: { batch_size: { maximum: 10 } }
        - if:
            required: [queue_arn]
            properties: { queue_arn: { pattern: "\\.fifo$" } }
          then:
            properties: { batch_size: { maximum: 10 } }
      x-iacp-group: Triggers
    dead_letter_target_arn:
      type: [string, "null"]
      default: null
      pattern: "^arn:aws[a-z-]*:(sqs|sns):[a-z0-9-]+:[0-9]{12}:.+$"
      description: SQS queue or SNS topic ARN for failed asynchronous invocations.
      x-iacp-ui: stack-output
    dead_letter_target_kms_key_arn:
      type: [string, "null"]
      default: null
      pattern: "^arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/.+$"
      description: KMS key of the dead-letter target. Requires dead_letter_target_arn.
      x-iacp-ui: stack-output
    permissions_boundary_arn:
      type: [string, "null"]
      default: null
      pattern: "^arn:aws[a-z-]*:iam::[0-9]{12}:policy/[A-Za-z0-9+=,.@_/-]+$"
      description: IAM permissions boundary for the execution role. Null uses the platform's iacp-boundary policy; a boundary is always attached.
      x-iacp-group: Security
    extra_policy_jsons:
      type: object
      additionalProperties: { type: string }
      propertyNames: { pattern: "^[a-z0-9][a-z0-9-]{0,39}$" }
      maxProperties: 10
      default: {}
      description: Additional IAM policy documents keyed by a stable name. Allow statements must use explicit actions (no "*", "<service>:*", NotAction or NotResource).
      x-iacp-group: Security
      x-iacp-ui: stack-output
    tags:
      type: object
      additionalProperties: { type: string }
      propertyNames: { not: { pattern: "^iacp:" } }
      maxProperties: 30
      description: Extra tags. The iacp:* prefix is reserved.
      x-iacp-ui: key-value

outputs:
  - { name: id, description: Function name, wireable: true }
  - { name: arn, description: Function ARN, wireable: true }
  - { name: name, description: Computed function name, wireable: false }
  - { name: role_arn, description: Execution role ARN, wireable: true }
  - { name: invoke_arn, description: Invoke ARN for API Gateway and other services, wireable: true }
  - { name: log_group_name, description: CloudWatch log group name, wireable: true }
  - { name: kms_key_arn, description: KMS key ARN, wireable: true }
  - { name: iacp_metadata, description: Module name and version, wireable: false }

dependencies:
  - input: sqs_trigger.queue_arn
    description: Queue that triggers the function.
    accepts:
      - { module: sqs, output: arn }
  - input: sqs_trigger.kms_key_arn
    description: Key encrypting the trigger queue.
    accepts:
      - { module: sqs, output: kms_key_arn }
  - input: dead_letter_target_arn
    description: Destination for failed asynchronous invocations.
    accepts:
      - { module: sqs, output: arn }
  - input: dead_letter_target_kms_key_arn
    description: Key encrypting the dead-letter target.
    accepts:
      - { module: sqs, output: kms_key_arn }
  - input: extra_policy_jsons
    description: Access to other platform resources.
    accepts:
      - { module: sqs, output: consumer_policy_json }
      - { module: sqs, output: producer_policy_json }
      - { module: s3, output: read_policy_json }
      - { module: s3, output: write_policy_json }

cost:
  baseline_monthly_usd: 1.00
  drivers:
    - invocations_per_month
    - gb_seconds
    - log_ingestion_gb

upgrade:
  from: ">= 1.0.0, < 2.0.0"
  requires_migration: false
  notes: |
    Initial release.

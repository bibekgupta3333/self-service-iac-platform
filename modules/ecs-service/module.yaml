apiVersion: iacp.dev/v1
kind: Module
metadata:
  name: ecs-service
  version: 1.0.0
  displayName: ECS Fargate Service
  description: Fargate service with its own scanned, immutable ECR repository, least-privilege roles, encrypted logs, circuit-breaker rollback and an optional HTTPS load balancer.
  category: compute
  maturity: beta
  owners:
    - "@bibekgupta3333/platform"
  documentation: https://github.com/bibekgupta3333/self-service-iac-platform/tree/modules/ecs-service/v1.0.0/modules/ecs-service

compatibility:
  terraform: ">= 1.10, < 2.0"
  providers:
    hashicorp/aws: ">= 5.70, < 6.0"
  environments: [development, staging, production]

inputs:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  required: [name, vpc_id, subnet_ids, image_tag]
  additionalProperties: false
  properties:
    name:
      type: string
      pattern: "^[a-z][a-z0-9-]{1,39}[a-z0-9]$"
      description: Logical service name without consecutive hyphens. Resources are named <team>-<environment>-<name> (at most 50 characters).
      x-iacp-immutable: true
    vpc_id:
      type: string
      pattern: "^vpc-[0-9a-f]{8,17}$"
      description: VPC that holds the service and its load balancer.
      x-iacp-group: Network
      x-iacp-ui: stack-output
      x-iacp-immutable: true
    subnet_ids:
      type: array
      items: { type: string, pattern: "^subnet-[0-9a-f]{8,17}$" }
      minItems: 1
      maxItems: 16
      description: Private subnets for the tasks. Tasks never get a public IP.
      x-iacp-group: Network
      x-iacp-ui: stack-output
    https_egress_cidr_blocks:
      type: array
      items: { type: string }
      minItems: 1
      maxItems: 20
      default: ["0.0.0.0/0"]
      description: IPv4 ranges the tasks may reach on TCP 443 (AWS APIs through NAT or VPC endpoints).
      x-iacp-group: Network
      x-iacp-ui: list
    egress_security_group_rules:
      type: array
      maxItems: 20
      default: []
      description: Extra egress to other security groups, for example a postgres or redis security group on its port.
      items:
        type: object
        additionalProperties: false
        required: [description, port, security_group_id]
        properties:
          description: { type: string, minLength: 1, maxLength: 200 }
          port: { type: integer, minimum: 1, maximum: 65535 }
          security_group_id: { type: string, pattern: "^sg-[0-9a-f]{8,17}$", x-iacp-ui: stack-output }
      x-iacp-group: Network
    load_balancer:
      type: [object, "null"]
      default: null
      description: Optional Application Load Balancer with an HTTPS listener (ACM certificate) and an HTTP-to-HTTPS redirect. Null runs a worker without one.
      additionalProperties: false
      required: [subnet_ids, certificate_arn, ingress_cidr_blocks]
      properties:
        internal:
          type: boolean
          default: true
        subnet_ids:
          type: array
          items: { type: string, pattern: "^subnet-[0-9a-f]{8,17}$" }
          minItems: 2
          x-iacp-ui: stack-output
        certificate_arn:
          type: string
          pattern: "^arn:aws[a-z-]*:acm:[a-z0-9-]+:[0-9]{12}:certificate/.+$"
        ingress_cidr_blocks:
          type: array
          items: { type: string }
          minItems: 1
          maxItems: 20
        ssl_policy:
          type: string
          enum:
            - ELBSecurityPolicy-TLS13-1-2-2021-06
            - ELBSecurityPolicy-TLS13-1-2-Res-2021-06
            - ELBSecurityPolicy-TLS13-1-3-2021-06
            - ELBSecurityPolicy-TLS13-1-2-FIPS-2023-04
            - ELBSecurityPolicy-TLS13-1-3-FIPS-2023-04
          default: ELBSecurityPolicy-TLS13-1-2-2021-06
        idle_timeout:
          type: integer
          minimum: 1
          maximum: 4000
          default: 60
      x-iacp-group: Load balancer
    cluster_arn:
      type: [string, "null"]
      default: null
      pattern: "^arn:aws[a-z-]*:ecs:[a-z0-9-]+:[0-9]{12}:cluster/[A-Za-z0-9_-]{1,255}$"
      description: Existing ECS cluster ARN. Null creates a dedicated cluster with Container Insights.
      x-iacp-ui: stack-output
      x-iacp-immutable: true
    cpu:
      type: integer
      enum: [256, 512, 1024, 2048, 4096]
      default: 256
      description: Task CPU units (256 = 0.25 vCPU).
      x-iacp-group: Capacity
      x-iacp-ui: select
    memory:
      type: integer
      minimum: 512
      maximum: 30720
      default: 512
      description: Task memory in MiB; must be a Fargate combination for the chosen cpu.
      x-iacp-group: Capacity
    architecture:
      type: string
      enum: [X86_64, ARM64]
      default: X86_64
      description: CPU architecture of the task.
      x-iacp-group: Capacity
      x-iacp-ui: select
    desired_count:
      type: integer
      minimum: 0
      maximum: 100
      default: 1
      description: Number of tasks to keep running. 0 is allowed until the first image is pushed.
      x-iacp-group: Capacity
    image_tag:
      type: string
      pattern: "^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$"
      not: { enum: [latest, main, master, LATEST, MAIN, MASTER, Latest, Main, Master] }
      description: Image tag in the service's ECR repository, pushed by the application's CI. Moving tags such as latest are rejected.
      x-iacp-group: Container
    container_port:
      type: integer
      minimum: 1024
      maximum: 65535
      default: 8080
      description: Port the container listens on (1024 or higher; the container runs as non-root).
      x-iacp-group: Container
      x-iacp-immutable: true
    container_user:
      type: string
      pattern: "^[0-9]{1,10}(:[0-9]{1,10})?$"
      not: { pattern: "^0(:|$)" }
      default: "1000:1000"
      description: UID[:GID] the container runs as. Root is rejected.
      x-iacp-group: Container
    health_check_path:
      type: string
      pattern: "^/[A-Za-z0-9/_.~-]*$"
      maxLength: 1024
      default: /health
      description: HTTP path the load balancer probes for a 200-399 response.
      x-iacp-group: Container
    environment_variables:
      type: object
      additionalProperties: { type: string }
      propertyNames:
        pattern: "^[A-Za-z][A-Za-z0-9_]*$"
        not: { pattern: "^(AWS|ECS)_" }
      maxProperties: 50
      default: {}
      description: Non-secret configuration. Use secrets for anything sensitive. Keys may not start with AWS_ or ECS_.
      x-iacp-group: Container
      x-iacp-ui: key-value
    secrets:
      type: object
      additionalProperties:
        type: string
        pattern: "^arn:aws[a-z-]*:(secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@!-]+|ssm:[a-z0-9-]+:[0-9]{12}:parameter/[A-Za-z0-9/_.-]+)$"
      propertyNames:
        pattern: "^[A-Za-z][A-Za-z0-9_]*$"
        not: { pattern: "^(AWS|ECS)_" }
      maxProperties: 50
      default: {}
      description: Environment variables injected from Secrets Manager secrets or SSM parameters (NAME = ARN). The execution role may read exactly these.
      x-iacp-group: Container
      x-iacp-ui: key-value
    secrets_kms_key_arns:
      type: array
      items: { type: string, pattern: "^arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/.+$" }
      maxItems: 10
      default: []
      description: KMS keys encrypting the secrets; the execution role gets kms:Decrypt on exactly these.
      x-iacp-group: Container
      x-iacp-ui: stack-output
    permissions_boundary_arn:
      type: [string, "null"]
      default: null
      pattern: "^arn:aws[a-z-]*:iam::[0-9]{12}:policy/[A-Za-z0-9+=,.@_/-]+$"
      description: IAM permissions boundary for both roles. Null uses the platform's iacp-boundary policy; a boundary is always attached.
      x-iacp-group: Security
    extra_policy_jsons:
      type: object
      additionalProperties: { type: string }
      propertyNames: { pattern: "^[a-z0-9][a-z0-9-]{0,39}$" }
      maxProperties: 10
      default: {}
      description: Additional IAM policy documents for the task role keyed by a stable name. Allow statements must use explicit actions (no "*", "<service>:*", NotAction or NotResource).
      x-iacp-group: Security
      x-iacp-ui: stack-output
    ecr_max_image_count:
      type: integer
      minimum: 1
      maximum: 1000
      default: 30
      description: Tagged images kept in the repository; untagged images expire after 7 days.
      x-iacp-group: Registry
    log_retention_days:
      type: integer
      enum: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]
      default: 30
      description: CloudWatch Logs retention in days for container logs.
      x-iacp-group: Observability
    kms_key_arn:
      type: [string, "null"]
      default: null
      pattern: "^arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/.+$"
      description: Existing customer-managed KMS key ARN for the repository and logs. If null, a dedicated key is created.
      x-iacp-group: Encryption
      x-iacp-immutable: true
    tags:
      type: object
      additionalProperties: { type: string }
      propertyNames: { not: { pattern: "^iacp:" } }
      maxProperties: 30
      description: Extra tags. The iacp:* prefix is reserved.
      x-iacp-ui: key-value

outputs:
  - { name: id, description: ECS service ID, wireable: true }
  - { name: arn, description: ECS service ARN, wireable: true }
  - { name: name, description: Computed resource name, wireable: false }
  - { name: service_name, description: ECS service name, wireable: true }
  - { name: cluster_arn, description: ARN of the cluster running the service, wireable: true }
  - { name: alb_dns_name, description: Load balancer DNS name (null without one), wireable: true }
  - { name: service_url, description: HTTPS URL of the load balancer (null without one), wireable: true }
  - { name: ecr_repository_url, description: ECR repository URL CI pushes to, wireable: true }
  - { name: task_role_arn, description: Task role ARN, wireable: true }
  - { name: execution_role_arn, description: Execution role ARN, wireable: true }
  - { name: security_group_id, description: Security group of the tasks, wireable: true }
  - { name: log_group_name, description: Container log group name, wireable: true }
  - { name: kms_key_arn, description: KMS key ARN, wireable: true }
  - { name: iacp_metadata, description: Module name and version, wireable: false }

dependencies:
  - input: vpc_id
    description: VPC that holds the service.
    accepts:
      - { module: vpc, output: id }
  - input: subnet_ids
    description: Private subnets for the tasks.
    accepts:
      - { module: vpc, output: private_subnet_ids }
  - input: load_balancer.subnet_ids
    description: Subnets for the load balancer (private for internal, public for internet-facing).
    accepts:
      - { module: vpc, output: private_subnet_ids }
      - { module: vpc, output: public_subnet_ids }
  - input: secrets
    description: Secrets injected as environment variables.
    accepts:
      - { module: postgres, output: secret_arn }
      - { module: redis, output: secret_arn }
  - input: secrets_kms_key_arns
    description: Keys encrypting the injected secrets.
    accepts:
      - { module: postgres, output: kms_key_arn }
      - { module: redis, output: kms_key_arn }
  - input: egress_security_group_rules
    description: Data stores the tasks connect to.
    accepts:
      - { module: postgres, output: security_group_id }
      - { module: redis, output: security_group_id }
  - input: extra_policy_jsons
    description: Access to other platform resources.
    accepts:
      - { module: sqs, output: consumer_policy_json }
      - { module: sqs, output: producer_policy_json }
      - { module: s3, output: read_policy_json }
      - { module: s3, output: write_policy_json }

cost:
  baseline_monthly_usd: 30.00
  drivers:
    - task_vcpu_hours
    - task_memory_gb_hours
    - load_balancer_hours
    - log_ingestion_gb

upgrade:
  from: ">= 1.0.0, < 2.0.0"
  requires_migration: false
  notes: |
    Initial release.

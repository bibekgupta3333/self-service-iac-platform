apiVersion: iacp.dev/v1
kind: Module
metadata:
  name: postgres
  version: 1.0.0
  displayName: PostgreSQL (RDS)
  description: Private, encrypted RDS PostgreSQL with TLS enforced, an RDS-managed master secret, backups and environment-driven deletion protection.
  category: database
  maturity: beta
  owners:
    - "@bibekgupta3333/platform"
  documentation: https://github.com/bibekgupta3333/self-service-iac-platform/tree/modules/postgres/v1.0.0/modules/postgres

compatibility:
  terraform: ">= 1.10, < 2.0"
  providers:
    hashicorp/aws: ">= 5.70, < 6.0"
  environments: [development, staging, production]

inputs:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  required: [name, vpc_id, subnet_ids]
  additionalProperties: false
  properties:
    name:
      type: string
      pattern: "^[a-z][a-z0-9-]{1,39}[a-z0-9]$"
      description: Logical database name without consecutive hyphens. The instance identifier is <team>-<environment>-<name> (at most 63 characters).
      x-iacp-immutable: true
    vpc_id:
      type: string
      pattern: "^vpc-[0-9a-f]{8,17}$"
      description: VPC that holds the database.
      x-iacp-group: Network
      x-iacp-ui: stack-output
      x-iacp-immutable: true
    subnet_ids:
      type: array
      items: { type: string, pattern: "^subnet-[0-9a-f]{8,17}$" }
      minItems: 2
      maxItems: 16
      uniqueItems: true
      description: Private subnets in at least two Availability Zones.
      x-iacp-group: Network
      x-iacp-ui: stack-output
    allowed_security_group_ids:
      type: array
      items: { type: string, pattern: "^sg-[0-9a-f]{8,17}$" }
      maxItems: 20
      default: []
      description: Security groups allowed to connect on the database port. Nothing else can reach the instance.
      x-iacp-group: Network
      x-iacp-ui: stack-output
    port:
      type: integer
      minimum: 1150
      maximum: 65535
      default: 5432
      description: TCP port the database listens on.
      x-iacp-group: Network
    engine_version:
      type: string
      pattern: "^(14|15|16|17)(\\.[0-9]+)?$"
      default: "16"
      description: PostgreSQL major version (14-17), optionally with a minor version. Minor versions upgrade automatically.
    instance_class:
      type: string
      pattern: "^db\\.[a-z0-9]+\\.[a-z0-9]+$"
      default: db.t4g.micro
      description: RDS instance class, for example db.t4g.micro or db.r7g.large.
    allocated_storage_gb:
      type: integer
      minimum: 20
      maximum: 65536
      default: 20
      description: Initial gp3 storage in GiB.
    max_allocated_storage_gb:
      type: [integer, "null"]
      minimum: 20
      maximum: 65536
      default: null
      description: Upper limit for storage autoscaling in GiB (at least allocated_storage_gb). Null disables autoscaling.
    multi_az:
      type: [boolean, "null"]
      default: null
      description: Standby in a second Availability Zone. Null means on in production and off elsewhere; false is rejected in production.
      x-iacp-ui: toggle
    database_name:
      type: [string, "null"]
      pattern: "^[a-z][a-z0-9_]{0,62}$"
      default: null
      description: Database created with the instance. Null creates none.
      x-iacp-immutable: true
    master_username:
      type: string
      pattern: "^[a-z][a-z0-9_]{0,62}$"
      not: { enum: [postgres, rdsadmin, admin, root] }
      default: iacp_admin
      description: Master user name. RDS generates and rotates its password in Secrets Manager.
      x-iacp-immutable: true
    backup_retention_days:
      type: [integer, "null"]
      minimum: 1
      maximum: 35
      default: null
      description: Days of automated backups. Null means 7 (35 in production); production needs at least 7.
      x-iacp-group: Recovery
    iam_database_authentication_enabled:
      type: boolean
      default: true
      description: Allow IAM database authentication in addition to passwords.
      x-iacp-group: Security
      x-iacp-ui: toggle
    log_retention_days:
      type: integer
      enum: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]
      default: 30
      description: CloudWatch Logs retention in days for exported database logs.
      x-iacp-group: Observability
    kms_key_arn:
      type: [string, "null"]
      default: null
      pattern: "^arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/.+$"
      description: Existing customer-managed KMS key ARN. If null, a dedicated key is created.
      x-iacp-group: Encryption
      x-iacp-immutable: true
    tags:
      type: object
      additionalProperties: { type: string }
      propertyNames: { not: { pattern: "^iacp:" } }
      maxProperties: 30
      description: Extra tags. The iacp:* prefix is reserved.
      x-iacp-ui: key-value

outputs:
  - { name: id, description: DB instance identifier, wireable: true }
  - { name: arn, description: DB instance ARN, wireable: true }
  - { name: name, description: Computed instance identifier, wireable: false }
  - { name: endpoint, description: DNS name clients connect to, wireable: true }
  - { name: port, description: TCP port, wireable: true }
  - { name: secret_arn, description: ARN of the RDS-managed master user secret, wireable: true }
  - { name: connection, description: "Object with host, port and secret_arn", wireable: true }
  - { name: security_group_id, description: Security group attached to the instance, wireable: true }
  - { name: kms_key_arn, description: KMS key ARN, wireable: true }
  - { name: iacp_metadata, description: Module name and version, wireable: false }

dependencies:
  - input: vpc_id
    description: VPC that holds the database.
    accepts:
      - { module: vpc, output: id }
  - input: subnet_ids
    description: Private subnets for the DB subnet group.
    accepts:
      - { module: vpc, output: private_subnet_ids }
  - input: allowed_security_group_ids
    description: Clients allowed to connect.
    accepts:
      - { module: ecs-service, output: security_group_id }

cost:
  baseline_monthly_usd: 15.00
  drivers:
    - instance_hours
    - storage_gb
    - backup_storage_gb
    - multi_az

upgrade:
  from: ">= 1.0.0, < 2.0.0"
  requires_migration: false
  notes: |
    Initial release.

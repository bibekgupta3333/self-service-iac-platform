apiVersion: iacp.dev/v1
kind: Module
metadata:
  name: s3
  version: 1.0.0
  displayName: S3 Bucket
  description: Private, KMS-encrypted S3 bucket with versioning, lifecycle rules, TLS-only access and least-privilege access policies.
  category: storage
  maturity: beta
  owners:
    - "@bibekgupta3333/platform"
  documentation: https://github.com/bibekgupta3333/self-service-iac-platform/tree/modules/s3/v1.0.0/modules/s3

compatibility:
  terraform: ">= 1.10, < 2.0"
  providers:
    hashicorp/aws: ">= 5.60, < 6.0"
  environments: [development, staging, production]

inputs:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  required: [name]
  additionalProperties: false
  properties:
    name:
      type: string
      pattern: "^[a-z][a-z0-9-]{2,40}$"
      description: Logical bucket name. Final name is <team>-<environment>-<name> (at most 63 characters).
      x-iacp-immutable: true
    versioning_enabled:
      type: boolean
      default: true
      description: Keep object versions. Forced on in production.
    kms_key_arn:
      type: [string, "null"]
      default: null
      pattern: "^arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/.+$"
      description: Existing KMS key ARN. If null, a dedicated key with rotation is created.
      x-iacp-group: Encryption
      x-iacp-immutable: true
    noncurrent_version_expiration_days:
      type: integer
      minimum: 1
      maximum: 3650
      default: 90
      description: Days after which noncurrent object versions expire.
      x-iacp-group: Lifecycle
    transition_to_ia_days:
      type: [integer, "null"]
      minimum: 30
      default: null
      description: Days after which current objects move to STANDARD_IA. Null disables.
      x-iacp-group: Lifecycle
    force_destroy:
      type: boolean
      default: false
      description: Allow destroy with objects present. Not allowed in production.
      x-iacp-ui: danger-toggle
    access_logging:
      type: [object, "null"]
      default: null
      description: Server access logging to an existing bucket. Null disables access logging.
      additionalProperties: false
      required: [target_bucket]
      properties:
        target_bucket:
          type: string
          pattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
        target_prefix:
          type: string
      x-iacp-group: Logging
    key_service_principals:
      type: array
      items: { type: string, pattern: "^[a-z0-9-]+(\\.[a-z0-9-]+)*\\.amazonaws\\.com$" }
      uniqueItems: true
      default: []
      description: AWS service principals allowed to use the module-created key for this account.
      x-iacp-group: Encryption
    additional_policy_statements:
      type: array
      maxItems: 10
      default: []
      description: Extra bucket policy statements. Allow statements must name specific principals.
      items:
        type: object
        additionalProperties: false
        required: [sid, effect, actions, principal_type, principal_identifiers]
        properties:
          sid: { type: string, pattern: "^[A-Za-z0-9]{1,64}$", not: { enum: [DenyInsecureTransport, DenyOutdatedTls] } }
          effect: { enum: [Allow, Deny] }
          actions: { type: array, minItems: 1, items: { type: string } }
          principal_type: { enum: [AWS, Service, CanonicalUser, "*"] }
          principal_identifiers: { type: array, minItems: 1, items: { type: string } }
          resources: { type: array, items: { type: string } }
          conditions:
            type: array
            items:
              type: object
              additionalProperties: false
              required: [test, variable, values]
              properties:
                test: { type: string }
                variable: { type: string }
                values: { type: array, items: { type: string } }
        if: { properties: { effect: { const: Allow } } }
        then:
          properties:
            principal_type: { not: { const: "*" } }
            principal_identifiers: { not: { contains: { const: "*" } } }
      x-iacp-group: Access
    tags:
      type: object
      additionalProperties: { type: string }
      propertyNames: { not: { pattern: "^iacp:" } }
      maxProperties: 30
      description: Extra tags. The iacp:* prefix is reserved.
      x-iacp-ui: key-value

outputs:
  - { name: id, description: Bucket name, wireable: true }
  - { name: arn, description: Bucket ARN, wireable: true }
  - { name: name, description: Computed bucket name, wireable: false }
  - { name: kms_key_arn, description: KMS key ARN, wireable: true }
  - { name: read_policy_json, description: IAM policy granting read access, wireable: true }
  - { name: write_policy_json, description: IAM policy granting write access, wireable: true }
  - { name: iacp_metadata, description: Module name and version, wireable: false }

cost:
  baseline_monthly_usd: 1.00
  drivers:
    - storage_gb
    - requests_per_month
    - kms_requests

upgrade:
  from: ">= 1.0.0, < 2.0.0"
  requires_migration: false
  notes: |
    Initial release.
